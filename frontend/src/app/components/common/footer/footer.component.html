<footer
    class="footer roboto-custom-font"
    [ngClass]="themeHandler.activeTheme() === ThemeOptionEnum.LIGHT
        ? 'footer-lightmode'
        : 'footer-darkmode'
    "
    >
    <div class="footer-dialog-wrapper">
        <span>Made with</span>
        <i id="love" class="icon-base icon-love"></i>
        <span>and</span>
        <img id="monster" src="assets/img/monster.png" alt="monster energy">
        <span>by</span>
        <a>yqni13</a>
        <span>.</span>
    </div>
    @if (themeHandler.activeTheme() === ThemeOptionEnum.LIGHT) {
        <div class="footer-data link-primary" id="author">
            <a href="{{source.lightmode_bg}}" target="_blank"><i class="icon-base icon-Camera"></i>Source (background image)</a>
        </div>
    }
    <div class="footer-data" id="footnote">
        <a><i class="icon-base icon-Copyright"></i> 2026, Lukas Varga. All rights reserved. [v{{version}}]</a>
    </div>
</footer>
