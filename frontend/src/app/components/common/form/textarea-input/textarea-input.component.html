<div class="textareainput custom-input" ngClass="{{ngClass()}}">
    <i
        id="custom-icon"
        class="icon-base"
        ngClass="{{'icon-' + icon()}}"
    ></i>
    <textarea
        id="{{'custom-form-' + fieldName()}}"
        class="roboto-custom-font"
        [formField]="field"
        placeholder="{{placeholder()}}"
        [ngStyle]="customStyle()"
        rows="{{rows()}}"
    ></textarea>
    @if (((isFocused() && hasErrorOnFocus()) || !isFocused()) && hasError()) {
        <i
            id="error-icon"
            class="icon-base icon-Warning"
            ngClass="warning-input-text"
        ></i>
    }
    @if (hasError()) {
        <app-validation-input
            [fieldState]="fieldState()"
            [fieldName]="fieldName()"
            [isFocused]="isFocused()"
            [errOnFocusList]="errorOnFocusList"
        ></app-validation-input>
    }
    @if (lengthLimit() !== 0 && field().value().length <= lengthLimit()) {
        <span id="textareainput-length">
            {{(lengthLimit()
            - field().value().length)
            + ' / ' + lengthLimit()}}
        </span>
    }
</div>
