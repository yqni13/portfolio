<div class="textareainput" ngClass="{{ngClass()}}">
    <i
        id="custom-icon"
        class="icon-base"
        ngClass="{{'icon-' + icon()}}"
    ></i>
    <textarea
        id="{{'custom-form-' + fieldName()}}"
        class="roboto-custom-font"
        [formField]="field"
        placeholder="{{placeholder()}}"
        [ngStyle]="customStyle()"
        rows="{{rows()}}"
    ></textarea>
    @if (showValidation()) {
        <i
            id="error-icon"
            class="icon-base icon-Warning"
            ngClass="warning-input-text"
        ></i>
    }
</div>
@if (showValidation()) {
    <app-validation-input
        [fieldState]="fieldState()"
        [fieldName]="fieldName()"
        [isFocused]="isFocused()"
    ></app-validation-input>
}
