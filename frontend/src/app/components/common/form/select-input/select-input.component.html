<div class="selectinput custom-input" ngClass="{{ngClass()}}">
    <i
        id="custom-icon"
        class="icon-base"
        ngClass="{{'icon-' + icon()}}"
    ></i>
    <select
        id="{{'custom-form-' + fieldName()}}"
        [formField]="field"
        (change)="selectOption($event)"
        [ngStyle]="isSelected ? customStyle() : readonlyStyle()"
    >
        <option id="option-placeholder" value="" disabled>{{placeholder()}}</option>
        <hr>
        @for(option of options() ?? {} | keyvalue; track $index) {
            <option
                value="{{option.value}}"
            >{{option.value}}</option>
        }
    </select>
    @if (((isFocused() && hasErrorOnFocus()) || !isFocused()) && hasError()) {
        <i
            id="error-icon"
            class="icon-base icon-Warning"
            ngClass="warning-input-text"
        ></i>
    }
    @if (hasError()) {
        <app-validation-input
            [fieldState]="fieldState()"
            [fieldName]="fieldName()"
            [isFocused]="isFocused()"
            [errOnFocusList]="errorOnFocusList"
        ></app-validation-input>
    }
</div>
