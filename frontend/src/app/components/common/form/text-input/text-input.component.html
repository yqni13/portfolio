<div class="textinput custom-input" ngClass="{{ngClass()}}">
    <i
        id="custom-icon"
        class="icon-base"
        ngClass="{{'icon-' + icon()}}"
    ></i>
    <input
        id="{{'custom-form-' + fieldName()}}"
        [formField]="field"
        type="{{inputType()}}"
        placeholder="{{placeholder()}}"
        [ngStyle]="customStyle()"
    >
    @if (((isFocused() && hasErrorOnFocus()) || !isFocused()) && hasError()) {
        <i
            id="error-icon"
            class="icon-base icon-Warning"
            ngClass="warning-input-text"
        ></i>
    }
    @if (hasError()) {
        <app-validation-input
            [fieldState]="fieldState()"
            [fieldName]="fieldName()"
            [isFocused]="isFocused()"
            [errOnFocusList]="errorOnFocusList"
        ></app-validation-input>
    }
</div>
