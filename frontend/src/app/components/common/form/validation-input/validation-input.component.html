<ng-container *yqni13Var="field() as field">
    <div class="validation-errors">
        @for(err of field.errors(); track $index) {
            @if (isFocused() && displayErrorOnFocus(err.kind) || !isFocused()) {
                <!-- SINGLE ACTIVE VALIDATION LIMIT --> 
                @if ($index < 1) {
                    <div class="validation-message">
                        {{mapErrorValues(err.kind)}}
                    </div>
                }
            }
        }
    </div>
</ng-container>
