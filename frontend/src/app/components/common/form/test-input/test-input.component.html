<div>
    <i
        id="custom-icon"
        class="icon-base"
        ngClass="{{'icon-' + icon()}}"
    ></i>
    <input
        [type]="inputType()"
        id="{{'custom-form' + fieldName()}}"
        [formField]="field"
        placeholder="{{placeholder()}}"
        [ngStyle]="customStyle()"
    >
    @if(field().invalid() && (field().dirty() || field().touched())) {
        <i
            id="error-icon"
            class="icon-base icon-Warning"
            ngClass="warning-input-text"
        ></i>
    }
</div>
<app-validation-input
    [fieldState]="fieldState()"
    [fieldName]="fieldName()"
></app-validation-input>
