<section class="contact" id="head-contact">
    <div class="page-head-wrapper">
        <h2 class="yqni13-highlight">{{data.title}}</h2>
        <p class="head-text">{{data.subTitle}}</p>
    </div>
    <div class="contact-content">
        <div class="contact-form-wrapper">
            <h3>Send a message</h3>
            <form>
                <app-select-input
                    [fieldState]="contactForm.salutation()"
                    [placeholder]="'How should I address you?*'"
                    [fieldName]="'salutation'"
                    [options]="SalutationEnum"
                    [customStyle]="getCustomInputStyle()"
                    [readonlyStyle]="getCustomReadonlyStyle()"
                    [icon]="'Salutation'"
                    (byChange)="handleSalutationChange($event)"
                ></app-select-input>
                @if (isSelfDesc()) {
                    <app-text-input
                        [fieldState]="contactForm.selfdesc()"
                        [placeholder]="'Describe what address to use*'"
                        [fieldName]="'self-desc'"
                        [customStyle]="getCustomInputStyle()"
                        [icon]="'Other'"
                    ></app-text-input>
                }
                <app-text-input
                    [fieldState]="contactForm.name()"
                    [placeholder]="'Your name*'"
                    [fieldName]="'name'"
                    [customStyle]="getCustomInputStyle()"
                    [icon]="'User'"
                ></app-text-input>
                <app-text-input
                    [fieldState]="contactForm.email()"
                    [placeholder]="'Your email*'"
                    [fieldName]="'email'"
                    [customStyle]="getCustomInputStyle()"
                    [icon]="'MailThin'"
                ></app-text-input>
                <app-text-input
                    [fieldState]="contactForm.subject()"
                    [placeholder]="'What topic is it about?*'"
                    [fieldName]="'subject'"
                    [customStyle]="getCustomInputStyle()"
                    [icon]="'Subject'"
                ></app-text-input>
                <app-textarea-input
                    [fieldState]="contactForm.message()"
                    [fieldName]="'message'"
                    [placeholder]="'What are we talking about?*'"
                    [customStyle]="getCustomInputStyle()"
                    [icon]="'Message'"
                    [lengthLimit]="maxLengthValidation.message"
                    [rows]="7"
                ></app-textarea-input>
                <a
                    class="btn-primary"
                    (click)="onSubmit()"
                    (keydown.enter)="onSubmit()"
                    [attr.tabindex]="0"
                >
                    <span>Send message</span>
                    <i class="icon-base icon-Send"></i>
                </a>
                <p id="contact-hint">
                    I value your privacy. Your information will never be shared with third parties.
                </p>
            </form>
        </div>
    </div>
    @if(isLoading()) {
        <app-loader></app-loader>
    }
</section>
